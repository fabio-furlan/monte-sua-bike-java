<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Monte Sua Bike - Montar</title>
    <link rel="icon" href="imagens/icon1.png">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
    <link rel="stylesheet" href="base.css">
    <link rel="stylesheet" href="style_montar.css">
    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js" integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.3/umd/popper.min.js" integrity="sha384-ZMP7rVo3mIykV+2+9J3UJ46jBk0WLaUAdn689aCwoqbBJiSnjAK/l8WvCWPIPm49" crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/js/bootstrap.min.js" integrity="sha384-ChfqqxuZUCnJSK3+MXmPNIyE6ZbWh2IMqE241rYiqJxyMiZ6OW/JmZQ5stwEULTy" crossorigin="anonymous"></script>
    <!--font-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pragati+Narrow:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="site-header">
        <img class="logo" src="imagens/logo.png" alt="Monte Sua Bike">

        <nav class="site-nav">
            <ul>
                <li><img class="bandeira" src="imagens/brasil.jpg" alt="Brasil"></li>
                <li><a class="home" href="index.html">Home</a></li>
                <li><a class="menu-montar" href="montar.html" aria-current="page">Montar bike</a></li>
                <li><a class="menu-pecas" href="pecas.jsp">Cadastrar peças</a></li>
                <li><a class="menu-consulta" href="consulta">Consultar peças</a></li>
            </ul>
        </nav>
    </header>

    <!--Carrousel-->
    <div id="carouselExampleIndicators" class="carousel slide" data-ride="carousel">
        <ol class="carousel-indicators">
            <li data-target="#carouselExampleIndicators" data-slide-to="0" class="active"></li>
            <li data-target="#carouselExampleIndicators" data-slide-to="1"></li>
            <li data-target="#carouselExampleIndicators" data-slide-to="2"></li>
        </ol>
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img class="d-block w-100" src="imagens/d4.jpg" alt="Primeiro Slide">
            </div>
            <div class="carousel-item">
                <img class="d-block w-100" src="imagens/d7.jpg" alt="Segundo Slide">
            </div>
            <div class="carousel-item">
                <img class="d-block w-100" src="imagens/d1.jpg" alt="Terceiro Slide">
            </div>
        </div>
        <a class="carousel-control-prev" href="#carouselExampleIndicators" role="button" data-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="sr-only">Anterior</span>
        </a>
        <a class="carousel-control-next" href="#carouselExampleIndicators" role="button" data-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="sr-only">Próximo</span>
        </a>
    </div>
    <!--Carrousel-->

    <form name="frmPecas" action="insert" class="form-card">
        <h1 class="form-title">Montar sua bicicleta</h1>

        <div class="field">
            <label for="montar-id">ID</label>
            <input id="montar-id" type="text" placeholder="preenchimento automatico" value="0" required>
        </div>

        <div class="field">
            <label for="montar-produto">Produto</label>
            <select name="cars" id="montar-produto" required>
                <option value="Guidao">Guidão</option>
                <option value="Quadro">Quadro</option>
                <option value="Pedal">Pedal</option>
                <option value="Banco">Banco</option>
            </select>
        </div>

        <div class="field">
            <label for="montar-fabricante">Fabricante</label>
            <input id="montar-fabricante" type="text" placeholder="Fabricante" value="" required>
        </div>

        <div class="field">
            <label for="montar-valor">Valor</label>
            <input id="montar-valor" type="text" placeholder="Valor" value="" required>
        </div>

        <div class="form-actions">
            <button id="botao-formulario" type="submit" class="btn-gold">Editar</button>
            <button id="botao-formulario1" type="submit" class="btn-gold btn-danger-outline">Excluir</button>
            <input class="btn-gold" type="submit" value="Enviar">
        </div>
    </form>

    <footer class="footer">
        <div class="texto-copy">
            Copyright @ 2023
        </div>
    </footer>
</body>
</html>
